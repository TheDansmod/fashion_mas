line-length = 88

[lint]
# Start from every rule and add exceptions only with a justification (see cleanup.md §0.4).
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring); we keep D211
    "D213",   # conflicts with D212 (summary on first docstring line); we keep D212, matching google style
    "COM812", # conflicts with the `ruff format` trailing-comma handling
    "ISC001", # conflicts with the `ruff format` implicit string concatenation handling
    "EXE002", # the repo lives on an NTFS mount where every file reports the executable bit
]

[lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest relies on bare assert statements
    "D",       # test names are self-describing; docstrings add noise
    "PLR2004", # literal expected values are the point of assertions
    "INP001",  # pytest runs with --import-mode=importlib; tests/ is deliberately not a package
]
"scripts/**" = [
    "T201",    # scripts report progress on stdout by design
    "INP001",  # standalone scripts run by path, not an importable package
]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
