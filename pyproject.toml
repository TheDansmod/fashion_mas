[project]
name = "frag"
version = "0.1.0"
description = "FRAG: a multimodal, multi-agent fashion recommendation agent over a product catalogue (LangGraph, Qdrant, MCP, Chainlit)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "boto3>=1.42.78",
    "chainlit>=2.10.0",
    "fastmcp>=3.1.0",
    "langchain>=1.2.12",
    "langchain-aws>=1.4.5",
    "langchain-google-genai>=4.5.3",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-aws>=1.0.6",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "loguru>=0.7.3",
    "numpy>=2.4.2",
    "pandas>=3.0.2",
    "pillow>=12.1.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.3",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.17.0",
    "rich>=14.3.3",
    "tqdm>=4.67.3",
]

[project.scripts]
# `frag chat | eval | mcp` - frag.cli is created in cleanup.md Phase 8; until then this
# entry point is installed but raises ModuleNotFoundError when invoked
frag = "frag.cli:main"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.4",
]
ingest = [
    "h5py>=3.16.0",
]
siglip = [
    "open-clip-torch>=4.2.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

# CPU-only torch wheels for the `siglip` group: the app only embeds short query texts
# with Marqo-FashionSigLIP at runtime (no bulk embedding), so the CUDA build (~10x
# larger) is unnecessary. `explicit = true` keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["src/frag"]

[tool.pytest.ini_options]
# anything in add opts (options) gets added to the pytest command.
addopts = [
    # -ra: show short summary of all non-passing tests at the end
    "-ra",
    # -v:  show each test name and its pass/fail status
    "-v",
    # the import mode controls how pytest imports modules. by default, the imports are done by adding the parent directory prepended to the sys.path. importlib means that sys.path is not touched and importlib module is used instead for imports. This (importlib) is the modern recommendation.
    "--import-mode=importlib",
]
# coverage is opt-in to keep plain `pytest` fast; see the README for the coverage command
# this tells pytest where to search for test files - by restricting to tests folder we ensure that things are a little faster - pytest does not spend time walking through src folder
testpaths = ["tests"]
filterwarnings = [
    # langchain mcp server is throwing this internal warning and I am going to suppress it since I can't do anything about it until they fix it
    # this should work, but for some reason, does not # TODO: fix this
    'ignore:Use `streamable_http_client` instead:DeprecationWarning',
]

[tool.coverage.run]
omit = [
    "scripts/*",
]
