services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.17   # pin by digest, as in the Containerfile
    container_name: qdrant-server-nova
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      # Loopback only: the previous "6333:6333" published an unauthenticated
      # database on every host interface, i.e. to the LAN.
      - "127.0.0.1:6333:6333"  # HTTP API
      - "127.0.0.1:6334:6334"  # gRPC API
    volumes:
      - type: bind
        source: ./data/nova_qdrant_storage
        target: /qdrant/storage
      - type: bind
        source: ./data/nova_qdrant_snapshots
        target: /qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # optional LangGraph checkpointer backend:
  #   podman compose --profile postgres up -d   +   CHECKPOINTER__BACKEND=postgres
  # credentials match the default CHECKPOINTER__POSTGRES_DSN (local development only)
  postgres:
    image: docker.io/library/postgres:17
    container_name: frag-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: frag
      POSTGRES_PASSWORD: frag
      POSTGRES_DB: frag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - frag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frag -d frag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frag-postgres-data:
