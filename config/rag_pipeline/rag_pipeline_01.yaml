persistence:
  # this is the sqlite db used for checkpoint persistence
  db_path: data/pipeline_checkpoints.db
  # this is the name / id of the thread used for persistence (if you change the thread name, it becomes a new session)
  # need to create new thread id every time the schema changes
  thread_id: dev_run_004
  # this flag controls if we are resuming from a previous checkpoint or if we are starting a new thread
  resume_from_checkpoint: false

# TODO: put this under some sub-heading
# this is to determine the number of recommendations to return to the user if the user does not specify how many recommendations they want
default_num_recommendations: 3

# this is how many times we will try to generate the correct number of recommendations
num_recommendation_attempts: 3

