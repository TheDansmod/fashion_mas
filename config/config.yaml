defaults:
  - models: models_01
  - data: data_01
  - prompts: prompts_01
  - rag_pipeline: rag_pipeline_01
  - tracking: tracking_01
  - exploration: exploration_01
  - eval: eval_01
  - _self_
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# this is the mode in which the application is running - development, staging, production
app_env: ${oc.env:APP_ENV}

# this is the value of APP_ENV when the application is in development mode
dev_env: development

# this is the value of APP_ENV when the application is in production mode
prod_env: production

hydra:
  verbose:
    - app
    - src.rag_pipeline.rag_agent
    - src.data_manager.vector_db_writer
    - src.data_manager.vector_db_reader
    - src.mcp_server.mcp_client
    - src.utils.common_utils
    - src.evaluation.llm_as_judge
    - src.exploration.aws_upload_download_s3
